[project]
name = "kiro-meter"
version = "26.7.0"
description = "Personal, unofficial live TUI monitor for Kiro CLI credit usage"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rodrigo Marques", email = "romadasilva@protonmail.com" }]
keywords = ["kiro", "credits", "usage", "cli", "tui", "monitor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
dependencies = ["rich>=13", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/Seuqram78/kiro-meter"
Repository = "https://github.com/Seuqram78/kiro-meter"
Issues = "https://github.com/Seuqram78/kiro-meter/issues"

[project.scripts]
kiro-meter = "kiro_meter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiro_meter"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "complexipy>=1"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",   # conflicts with D211 (ruff docs)
  "D213",   # conflicts with D212 (ruff docs)
  "COM812", # conflicts with ruff format (ruff docs)
  "ISC001", # conflicts with ruff format (ruff docs)
  "CPY001", # copyright header not required (maintainer decision)
]

# Test files legitimately break rules that only make sense for shipped code.
# This is the single sanctioned per-file exception (maintainer decision).
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", # pytest assertions are the point of a test
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
